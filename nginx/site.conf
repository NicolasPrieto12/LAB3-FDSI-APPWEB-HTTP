# Virtual host del laboratorio (Paso 4 de la guia)
# En el Ubuntu Server, guardar como /etc/nginx/sites-available/muvautomation
# y habilitar con:
#   sudo ln -s /etc/nginx/sites-available/muvautomation /etc/nginx/sites-enabled/muvautomation
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    root /var/www/muvautomation;
    index index.html;
    server_name _;
    location / { try_files $uri $uri/ =404; }
}
