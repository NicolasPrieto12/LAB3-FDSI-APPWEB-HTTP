# Hardening inicial (Paso 15 de la guia)
# Pegar DENTRO del bloque server{} de site.conf, despues del retest inicial (Fase C/D).
# HTTP sigue siendo inseguro para confidencialidad/integridad a proposito:
# eso se corrige con HTTPS en el Laboratorio 4, aqui solo bajamos exposicion.

server_tokens off;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
autoindex off;
location ~ /\. { deny all; }

